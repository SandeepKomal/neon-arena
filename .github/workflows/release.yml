name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version matching package.json (example: 1.0.0)"
        required: true
        default: "1.0.0"
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const version = process.env.RELEASE_VERSION;
          if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid release version: ${version}`);
          }

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (pkg.version !== version) {
            throw new Error(`package.json is ${pkg.version}, requested ${version}`);
          }

          const action = fs.readFileSync("action.yml", "utf8");
          if (!/^name:\s*.+/m.test(action) || !/^runs:\s*$/m.test(action)) {
            throw new Error("action.yml is missing required metadata");
          }

          console.log(`Preparing Neon Arena v${version}`);
          NODE

      - name: Validate project
        run: |
          npm test
          npm run sample

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          release_args=(
            "v${RELEASE_VERSION}"
            "--target" "main"
            "--title" "Neon Arena v${RELEASE_VERSION}"
            "--generate-notes"
          )

          if [[ "${PRERELEASE}" == "true" ]]; then
            release_args+=("--prerelease")
          fi

          gh release create "${release_args[@]}"
